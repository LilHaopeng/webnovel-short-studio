interface:
  display_name: "短篇网文与微短剧爽文创作室"
  short_description: "面向5万字以内高概念脑洞短篇与微短剧爽文的一体化创作室：脑洞压测、双模板节拍、原声定调、手机竖屏写作、番茄投稿前体检与B轨感染力审稿、纯净导出与建书标签清单"
  default_prompt: "使用 $webnovel-short-studio 围绕当前脑洞或选题简报完成5问压测、一页高概念规则卡与双模板爽感节拍（适配番茄短故事/知乎盐言/七猫/点众/黑岩），定调原声切片后撰写手机竖屏正文，完成番茄投稿前排版语病体检、B轨感染力审读、纯净DOCX/TXT导出及平台投稿建书填表清单。"
